<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Search Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <button id="themeToggle" title="Toggle dark mode">🌙</button>

  <div class="page">
    <h1>GitHub Search Card</h1>
    <p class="subtitle">Look up any GitHub user's profile, top repos, and languages.</p>

    <div class="search-box">
      <input type="text" id="usernameInput" placeholder="Enter GitHub username" />
      <button id="searchBtn">Search</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
